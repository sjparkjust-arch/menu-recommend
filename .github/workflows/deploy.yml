name: Build and Push to ECR

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/terraform.yml'

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::369904859006:role/bobpick-github-actions-role
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: bobpick/app
          IMAGE_TAG: ${{ github.sha }}
        run: |
          SHORT_SHA=$(echo $IMAGE_TAG | cut -c1-7)
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$SHORT_SHA .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$SHORT_SHA
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
          echo "ECR_REGISTRY=$ECR_REGISTRY" >> $GITHUB_ENV
          echo "ECR_REPOSITORY=$ECR_REPOSITORY" >> $GITHUB_ENV

      - name: Checkout manifests repo
        uses: actions/checkout@v4
        with:
          repository: sjparkjust-arch/bobpick-manifests
          token: ${{ secrets.MANIFESTS_REPO_TOKEN }}
          path: bobpick-manifests

      - name: Update image tag with Kustomize
        working-directory: bobpick-manifests/base
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          ./kustomize edit set image bobpick-app-image=$ECR_REGISTRY/$ECR_REPOSITORY:${SHORT_SHA}

      - name: Commit and push manifest changes
        working-directory: bobpick-manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add base/kustomization.yaml
          git commit -m "ci: update image tag to ${SHORT_SHA}" || echo "No changes to commit"
          git push
