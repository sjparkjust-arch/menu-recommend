name: Deploy to Private ASG

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'infra/**'
      - '.github/workflows/terraform.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Get GitHub Runner IP
        id: ip
        run: echo "ipv4=$(curl -s https://checkip.amazonaws.com)" >> $GITHUB_OUTPUT

      - name: Add GitHub IP to Bastion Security Group
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.BASTION_SG_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32

      # [수정완료] ASG 이름이 무엇으로 끝나든 정확하게 찾아와서 사설 IP 리스트 추출
      - name: Get all running instance IPs from ASG
        id: instance_ips
        run: |
          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --query "AutoScalingGroups[?starts_with(AutoScalingGroupName, 'bobpick-app-asg')].Instances[?LifecycleState=='InService'][].InstanceId" \
            --output text)

          IPS=$(aws ec2 describe-instances --instance-ids $INSTANCE_IDS \
            --query 'Reservations[*].Instances[*].PrivateIpAddress' --output text)

          FORMATTED_IPS=$(echo $IPS | tr ' ' '\n' | grep -v "${{ secrets.BASTION_HOST }}" | grep -v "10.0.2.120" | tr '\n' ' ')
          
          echo "Found IPs: $FORMATTED_IPS"
          echo "ips=$FORMATTED_IPS" >> $GITHUB_OUTPUT

      # SSH agent는 한 번만 띄우고, IP 개수만큼 반복해서 순차 배포
      - name: Deploy to all instances via Bastion
        run: |
          eval $(ssh-agent -s)
          echo "${{ secrets.BASTION_KEY }}" | tr -d '\r' | ssh-add -

          for ip in ${{ steps.instance_ips.outputs.ips }}; do
            echo "===== Deploying to $ip ====="
            ssh -o StrictHostKeyChecking=no \
                -o ProxyCommand="ssh -o StrictHostKeyChecking=no -W %h:%p ${{ secrets.EC2_USER }}@${{ secrets.BASTION_HOST }}" \
                ${{ secrets.EC2_USER }}@$ip \
                "cd /home/ubuntu/menu-recommend && \
                 git pull origin main && \
                 source venv/bin/activate && \
                 pip install -r requirements.txt && \
                 python manage.py migrate && \
                 python manage.py collectstatic --noinput && \
                 sudo systemctl daemon-reload && \
                 sudo systemctl restart gunicorn"
          done
          
      - name: Remove GitHub IP from Bastion Security Group
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.BASTION_SG_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32  