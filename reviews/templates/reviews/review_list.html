{% extends "base.html" %}
{% load static %}

{% block content %}
<!-- 리뷰 게시판 상단 컨트롤 박스 -->
<div class="card mb-4 shadow-sm" style="border: 1px solid var(--line); border-radius: var(--radius);">
    <div class="card-body d-flex flex-wrap align-items-center justify-content-between p-3 gap-3">
        
        <!-- [좌측] 1. 후기 타이틀 및 2. 말머리 필터 -->
        <div class="d-flex align-items-center gap-3">
            <h4 class="mb-0 fw-bold" style="color: var(--brand);">후기</h4>
            
            <div class="btn-group" role="group">
                <a href="?category=&q={{ q }}&sort={{ sort }}" class="btn {% if not current_category %}btn-primary{% else %}btn-outline-primary{% endif %} btn-sm">전체</a>
                <a href="?category=RESTAURANT&q={{ q }}&sort={{ sort }}" class="btn {% if current_category == 'RESTAURANT' %}btn-primary{% else %}btn-outline-primary{% endif %} btn-sm">맛집후기</a>
                <a href="?category=FOOD&q={{ q }}&sort={{ sort }}" class="btn {% if current_category == 'FOOD' %}btn-primary{% else %}btn-outline-primary{% endif %} btn-sm">음식후기</a>
            </div>
        </div>

        <!-- 중앙 공백은 justify-content-between 으로 자동 생성됨 -->

        <!-- [우측] 3. 검색창, 4. 정렬 버튼, 5. 글쓰기 버튼 (여백 추가) -->
        <div class="d-flex align-items-center flex-wrap">
            
            <!-- 검색 폼 (우측에 me-3 여백 추가) -->
            <form method="GET" action="{% url 'reviews:list' %}" class="d-flex mb-0 align-items-center me-3">
                <input type="hidden" name="category" value="{{ current_category }}">
                <input type="hidden" name="sort" value="{{ sort }}">
                
                <input type="text" name="q" value="{{ q }}" class="form-control form-control-sm search-input me-2" placeholder="제목/내용 검색" style="width: 160px;">
                <button type="submit" class="btn btn-search btn-sm">검색</button>
            </form>

            <!-- 정렬 버튼 (우측에 me-3 여백 추가) -->
            <div class="btn-group me-3">
                <a href="?category={{ current_category }}&q={{ q }}&sort=latest" class="btn {% if sort == 'latest' %}btn-primary{% else %}btn-outline-primary{% endif %} btn-sm">최신순</a>
                <a href="?category={{ current_category }}&q={{ q }}&sort=likes" class="btn {% if sort == 'likes' %}btn-primary{% else %}btn-outline-primary{% endif %} btn-sm">좋아요순</a>
            </div>

            <!-- 글쓰기 버튼 (새로운 범용 글쓰기 주소로 연결) -->
            <a href="{% url 'reviews:create_general' %}" class="btn btn-success btn-sm">✏️ 글쓰기</a>
        </div>

    </div>
</div>

<!-- 여기에 리뷰 리스트 출력 코드 (반복문) 배치 -->

{% empty %}
    <div class="alert empty-alert">아직 등록된 후기가 없습니다.</div>
{% endfor %} 
-->

{% endblock %}
