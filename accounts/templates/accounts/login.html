{% extends "base.html" %}

{% block title %}로그인 · 메뉴 추천{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h4 class="card-title mb-3 text-center">로그인</h4>

                {% if form.errors %}
                <div class="alert alert-danger py-2">
                    아이디 또는 비밀번호가 올바르지 않습니다.
                </div>
                {% endif %}

                <form method="post" action="{% url 'accounts:login' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="{{ form.username.id_for_label }}" class="form-label">아이디</label>
                        <input type="text" name="{{ form.username.html_name }}"
                               id="{{ form.username.id_for_label }}"
                               class="form-control" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="{{ form.password.id_for_label }}" class="form-label">비밀번호</label>
                        <input type="password" name="{{ form.password.html_name }}"
                               id="{{ form.password.id_for_label }}"
                               class="form-control" required>
                    </div>
                    <input type="hidden" name="next" value="{{ next }}">
                    <button type="submit" class="btn btn-primary w-100">로그인</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
