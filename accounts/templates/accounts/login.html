{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <!-- 장고의 static 태그를 이용해 css 파일을 정확히 가리킵니다 -->
    <link rel="stylesheet" href="{% static 'accounts/login.css' %}">
</head>
<body>

    <div class="login-container">
        <!-- 나중에 이미지를 넣고 싶으시면 이 글자를 <img> 태그로 바꾸시면 됩니다 -->
        <img src="{% static 'accounts/images/logo.png' %}" alt="밥픽 로고" class="logo-img">

        <!-- action을 명확히 지정하여 장고의 login 뷰로 데이터를 보냅니다 -->
        <form method="post" action="{% url 'accounts:login' %}">
            {% csrf_token %}

            {% if errors.login %}
            <div class="error-msg">{{ errors.login }}</div>
            {% endif %}

            <!-- 아이디 입력창 -->
            <div>
                <input 
                    type="text" 
                    name="username" 
                    class="input-box"
                    placeholder="아이디" 
                    value="{{ username|default:'' }}" 
                    autocomplete="username" 
                    required 
                    autofocus
                >
                {% if errors.username %}
                <div class="error-msg">{{ errors.username }}</div>
                {% endif %}
            </div>

            <!-- 비밀번호 입력창 -->
            <div>
                <input 
                    type="password" 
                    name="password" 
                    class="input-box"
                    placeholder="비밀번호" 
                    autocomplete="current-password" 
                    required
                >
                {% if errors.password %}
                <div class="error-msg">{{ errors.password }}</div>
                {% endif %}
            </div>

            <!-- 아이디 기억하기 (label로 묶어서 글자를 눌러도 체크되게 만듦) -->
            <div class="checkbox-area">
                <label>
                    <input 
                        type="checkbox" 
                        name="remember_id" 
                        {% if remember_id %}checked{% endif %}
                    >
                    아이디 기억하기
                </label>
            </div>

            <!-- 로그인 버튼 -->
            <button type="submit" class="login-btn">로그인</button>
        </form>

        <!-- 하단 링크 영역 -->
        <div class="bottom-links">
            <a href="{% url 'accounts:signup' %}">회원가입</a>
            <span class="divider">|</span>
            <a href="{% url 'accounts:find_id' %}">아이디 찾기</a>
            <span class="divider">|</span>
            <a href="{% url 'accounts:find_pw' %}">비밀번호 찾기</a>
        </div>
    </div>

</body>
</html>
