# HTTP(80) → HTTPS(443) 리다이렉트
server {
    listen 80;
    server_name 192.168.32.74;
    return 301 https://$host$request_uri;
}

# HTTPS(443) — 자체 서명 인증서 (내부망, Let's Encrypt 불가)
server {
    listen 443 ssl;
    server_name 192.168.32.74;

    ssl_certificate     /etc/ssl/certs/menu-recommend.crt;
    ssl_certificate_key /etc/ssl/private/menu-recommend.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # 이미지 업로드 대비
    client_max_body_size 10M;

    # 정적/미디어 파일은 Nginx가 직접 서빙 (Gunicorn 거치지 않음)
    location /static/ {
        alias /home/tester/apps/menu-recommend/staticfiles/;
    }

    location /media/ {
        alias /home/tester/apps/menu-recommend/media/;
    }

    # 나머지 요청은 Gunicorn 유닉스 소켓으로 프록시
    location / {
        proxy_pass http://unix:/run/gunicorn/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Django의 SECURE_PROXY_SSL_HEADER가 이 값으로 원 요청이 https였는지 판별
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
