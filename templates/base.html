{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}메뉴 추천{% endblock %}</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/theme.css' %}">
</head>
<body class="bg-body-tertiary">
    <!-- base.html의 상단 Header / Navigation 영역 -->
<nav class="navbar navbar-expand-lg navbar-light bg-light mb-4 shadow-sm" style="background: var(--surface) !important; border-bottom: 1px solid var(--line);">
    <div class="container">
        <!-- 1. 로고 (메인 대시보드로 이동) -->
        <a class="navbar-brand fw-bold fs-4 d-flex align-items-center" href="{% url 'menus:dashboard' %}" style="color: var(--brand) !important;">
            🍴 밥픽
        </a>

        <!-- 모바일 토글 버튼 -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- 2. 중앙 카테고리 및 우측 유저 정보 영역 -->
        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 align-items-center text-uppercase">
                <li class="nav-item px-3 border-end border-opacity-50">
                    <a class="nav-link text-white fw-semibold" href="{% url 'menus:list' %}">
                        <div class="text-center" style="font-size: 0.95rem; font-weight: 700; color: var(--ink);">MENU</div>
                        <div class="text-center small opacity-75" style="font-size: 0.75rem; color: var(--muted);">메뉴</div>
                    </a>
                </li>
                <li class="nav-item px-3 border-end border-opacity-50">
                    <a class="nav-link text-white fw-semibold" href="{% url 'reviews:list' %}">
                        <div class="text-center" style="font-size: 0.95rem; font-weight: 700; color: var(--ink);">REVIEW</div>
                        <div class="text-center small opacity-75" style="font-size: 0.75rem; color: var(--muted);">후기</div>
                    </a>
                </li>
            </ul>

            <!-- 3. 우측: 회원 정보 영역 (회원 이름 / 마이페이지 버튼 / 로그아웃 버튼 / 로그인 및 회원가입 버튼) -->
            <div class="d-flex align-items-center ms-auto gap-2" style="white-space: nowrap;">
                {% if user.is_authenticated %}
                    <!-- 로그인 상태일 때 -->
                    <span class="small d-none d-md-inline me-2" style="color: var(--ink); font-weight: 500;">
                        <strong style="color: var(--brand); font-weight: 700;">{{ user.username }}</strong>님 안녕하세요!
                    </span>
                
                    <!-- 마이페이지 이동 버튼 -->
                    <a href="{% url 'accounts:profile' %}" 
                        class="btn btn-sm btn-outline-primary px-3 fw-bold" 
                        style="font-size: 0.85rem; border: 1.5px solid var(--brand) !important; color: var(--brand) !important; background-color: transparent; border-radius: 999px;">
                        마이페이지
                    </a>

                    <!-- 로그아웃 버튼 (추가됨) -->
                    <a href="{% url 'accounts:logout' %}" 
                        class="btn btn-sm btn-outline-secondary px-3 fw-bold" 
                        style="font-size: 0.85rem; border: 1.5px solid var(--line) !important; color: var(--muted) !important; background-color: transparent; border-radius: 999px;">
                        로그아웃
                    </a>
                {% else %}
                    <!-- 비로그인 상태일 때 표시할 로그인/회원가입 링크 -->
                    <a class="btn btn-sm btn-outline-primary px-3 fw-bold" 
                        href="{% url 'accounts:login' %}" 
                        style="font-size: 0.85rem; border: 1.5px solid var(--brand) !important; color: var(--brand) !important; background-color: transparent; border-radius: 999px;">
                        로그인
                    </a>
                    <a class="btn btn-sm btn-primary px-3 fw-bold" 
                    href="{% url 'accounts:signup' %}" 
                    style="font-size: 0.85rem; background-color: var(--brand) !important; border: none !important; color: white !important; border-radius: 999px;">
                    회원가입
                    </a>
                {% endif %}
            </div>
        </div>
    </div>
</nav>


    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
