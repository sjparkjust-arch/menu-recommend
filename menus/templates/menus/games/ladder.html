{% extends "base.html" %}

{% block title %}메뉴 사다리타기 · 밥픽{% endblock %}

{% block content %}
<div class="container" style="max-width: 720px; margin: 0 auto;">

    <div class="d-flex justify-content-between align-items-center mb-4 mt-3">
        <h3 class="fw-bold m-0" style="color: var(--ink);">🪜 메뉴 사다리타기</h3>
        <div class="d-flex gap-2">
            <a href="{% url 'menus:games' %}" class="btn btn-outline-secondary fw-bold px-3">게임 목록</a>
            <a href="{% url 'menus:dashboard' %}" class="btn btn-outline-dark fw-bold px-3">메인으로</a>
        </div>
    </div>

    <div class="d-flex justify-content-center gap-2 mb-3">
        {% for n in player_options %}
        <a href="?players={{ n }}" class="btn btn-sm {% if n == players %}btn-primary{% else %}btn-outline-primary{% endif %}">{{ n }}명</a>
        {% endfor %}
    </div>

    <div class="card shadow-sm">
        <div class="card-body py-4">
            <div id="ladderWrap" style="position: relative; max-width: 480px; margin: 0 auto;">
                <div id="ladderNames" style="position: relative; height: 44px;"></div>
                <canvas id="ladderCanvas" width="480" height="320" style="display:block; width:100%;"></canvas>
                <div id="ladderMenus" style="position: relative; height: 44px;"></div>
            </div>

            <div id="ladderResults" class="mt-4"></div>
        </div>
    </div>

</div>

{{ menus_json|json_script:"ladder-menus" }}

<style>
    .ladder-slot-btn {
        position: absolute; transform: translateX(-50%);
        font-size: .72rem; padding: .2rem .3rem; border: 1px solid var(--line); border-radius: 6px;
        background: #fff; text-align: center; width: 64px;
    }
    .ladder-name-input {
        position: absolute; transform: translateX(-50%);
        width: 70px; font-size: .72rem; text-align: center; padding: .15rem .2rem;
        border: 1px solid var(--line); border-radius: 6px;
    }
    .ladder-menu-label {
        position: absolute; transform: translateX(-50%);
        font-size: .72rem; font-weight: 600; text-align: center; width: 70px; color: var(--ink);
    }
    #ladderResults .ladder-result-item { padding: .35rem 0; border-bottom: 1px solid var(--line); font-size: .92rem; }
</style>
{% endblock %}

{% block extra_js %}
<script>
(function () {
    var menus = JSON.parse(document.getElementById('ladder-menus').textContent || '[]');
    var n = menus.length;
    if (!n) return;

    var canvas = document.getElementById('ladderCanvas');
    var ctx = canvas.getContext('2d');
    var W = canvas.width, H = canvas.height;
    var margin = 30;
    var colX = [];
    for (var i = 0; i < n; i++) {
        colX.push(margin + i * (W - margin * 2) / (n - 1 || 1));
    }
    var ROWS = 12;
    var rowY = [];
    for (var r = 0; r <= ROWS; r++) rowY.push(r * H / ROWS);

    // 가로줄(rung) 생성: 같은 행에서 인접 가로줄끼리 겹치지 않게(같은 세로줄을 두 번 안 씀)
    var rungsByRow = [];
    for (r = 0; r < ROWS; r++) {
        var row = new Array(n - 1).fill(false);
        var i = 0;
        while (i < n - 1) {
            if (Math.random() < 0.55) { row[i] = true; i += 2; } else { i += 1; }
        }
        rungsByRow.push(row);
    }

    function draw() {
        ctx.clearRect(0, 0, W, H);
        ctx.strokeStyle = '#EAD9C4';
        ctx.lineWidth = 2;
        // 세로줄
        for (i = 0; i < n; i++) {
            ctx.beginPath();
            ctx.moveTo(colX[i], rowY[0]);
            ctx.lineTo(colX[i], rowY[ROWS]);
            ctx.stroke();
        }
        // 가로줄(rung)
        ctx.strokeStyle = '#DE632E';
        ctx.lineWidth = 3;
        for (r = 0; r < ROWS; r++) {
            for (i = 0; i < n - 1; i++) {
                if (rungsByRow[r][i]) {
                    ctx.beginPath();
                    ctx.moveTo(colX[i], rowY[r + 1]);
                    ctx.lineTo(colX[i + 1], rowY[r + 1]);
                    ctx.stroke();
                }
            }
        }
    }
    draw();

    // 경로 계산: 세로줄을 타고 내려가다 가로줄을 만나면 반대편으로 이동
    function simulate(start) {
        var col = start;
        var path = [{ x: colX[col], y: rowY[0] }];
        for (var r = 0; r < ROWS; r++) {
            path.push({ x: colX[col], y: rowY[r + 1] });
            var row = rungsByRow[r];
            if (col > 0 && row[col - 1]) {
                col -= 1;
                path.push({ x: colX[col], y: rowY[r + 1] });
            } else if (col < n - 1 && row[col]) {
                col += 1;
                path.push({ x: colX[col], y: rowY[r + 1] });
            }
        }
        return { end: col, path: path };
    }

    // 참가자 이름 입력(상단) + 메뉴 라벨(하단) — colX 좌표에 맞춰 절대배치
    var namesEl = document.getElementById('ladderNames');
    var menusEl = document.getElementById('ladderMenus');
    var buttons = [];
    for (i = 0; i < n; i++) {
        var input = document.createElement('input');
        input.type = 'text';
        input.className = 'ladder-name-input';
        input.value = '참가자' + (i + 1);
        input.style.left = colX[i] + 'px';
        input.style.top = '0px';
        namesEl.appendChild(input);

        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'ladder-slot-btn';
        btn.textContent = '▼ 시작';
        btn.style.left = colX[i] + 'px';
        btn.style.top = '22px';
        btn.dataset.col = i;
        namesEl.appendChild(btn);
        buttons.push(btn);

        var label = document.createElement('div');
        label.className = 'ladder-menu-label';
        label.style.left = colX[i] + 'px';
        label.style.top = '4px';
        label.textContent = menus[i].name;
        menusEl.appendChild(label);
    }

    var playing = false;
    var resultsEl = document.getElementById('ladderResults');
    var colors = ['#F36235', '#2B1B12', '#3A6EA5', '#2C8C8C', '#DE632E', '#8C7568', '#C97B3D', '#E9A23B'];

    buttons.forEach(function (btn) {
        btn.addEventListener('click', function () {
            if (playing || btn.disabled) return;
            playing = true;
            buttons.forEach(function (b) { b.disabled = true; });

            var col = parseInt(btn.dataset.col, 10);
            var nameInput = namesEl.querySelectorAll('.ladder-name-input')[col];
            var sim = simulate(col);
            var color = colors[col % colors.length];
            var path = sim.path;
            var totalLen = path.length - 1;
            var step = 0;
            var startTime = null;
            var DURATION = 900;

            function frame(ts) {
                if (!startTime) startTime = ts;
                var elapsed = ts - startTime;
                draw();
                // 지나온 경로 그대로 그리기(참가자색), 현재 위치까지
                var progress = Math.min(elapsed / DURATION, 1);
                var idxFloat = progress * totalLen;
                var idx = Math.floor(idxFloat);
                var frac = idxFloat - idx;

                ctx.strokeStyle = color;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(path[0].x, path[0].y);
                for (var k = 1; k <= idx; k++) ctx.lineTo(path[k].x, path[k].y);
                var curX = path[Math.min(idx + 1, totalLen)].x;
                var curY = path[Math.min(idx + 1, totalLen)].y;
                if (idx < totalLen) {
                    curX = path[idx].x + (path[idx + 1].x - path[idx].x) * frac;
                    curY = path[idx].y + (path[idx + 1].y - path[idx].y) * frac;
                }
                ctx.lineTo(curX, curY);
                ctx.stroke();

                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(curX, curY, 6, 0, Math.PI * 2);
                ctx.fill();

                if (progress < 1) {
                    requestAnimationFrame(frame);
                } else {
                    playing = false;
                    buttons.forEach(function (b, bi) { if (bi !== col) b.disabled = false; });
                    var pick = menus[sim.end];
                    var item = document.createElement('div');
                    item.className = 'ladder-result-item';
                    item.innerHTML = (nameInput.value || ('참가자' + (col + 1))) + ' → <strong>' + pick.name + '</strong> '
                        + '<a href="/menus/' + pick.id + '/" class="ms-2 small">상세보기 →</a>';
                    resultsEl.prepend(item);
                }
            }
            requestAnimationFrame(frame);
        });
    });
})();
</script>
{% endblock %}
