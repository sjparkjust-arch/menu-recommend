{% extends "base.html" %}

{% block title %}음식 이상형 월드컵 · 밥픽{% endblock %}

{% block content %}
<div class="container" style="max-width: 720px; margin: 0 auto;">

    <div class="d-flex justify-content-between align-items-center mb-4 mt-3">
        <h3 class="fw-bold m-0" style="color: var(--ink);">🏆 음식 이상형 월드컵</h3>
        <div class="d-flex gap-2">
            <a href="{% url 'menus:games' %}" class="btn btn-outline-secondary fw-bold px-3">게임 목록</a>
            <a href="{% url 'menus:dashboard' %}" class="btn btn-outline-dark fw-bold px-3">메인으로</a>
        </div>
    </div>

    <div class="d-flex justify-content-center gap-2 mb-3">
        {% for s in size_options %}
        <a href="?size={{ s }}" class="btn btn-sm {% if s == size %}btn-primary{% else %}btn-outline-primary{% endif %}">{{ s }}강</a>
        {% endfor %}
    </div>

    <div class="text-center mb-3">
        <span id="wcProgress" class="badge text-bg-light border fs-6 fw-semibold"></span>
    </div>

    <div class="row g-3 justify-content-center" id="wcMatch"></div>

    <div id="wcFinal" class="card shadow-sm mt-3 text-center py-5" hidden>
        <div class="fs-3 mb-2">🏆</div>
        <div class="fs-4 fw-bold" style="color: var(--ink);" id="wcFinalName"></div>
        <div class="mt-3">
            <a href="#" id="wcFinalLink" class="btn btn-outline-primary">메뉴 상세보기 →</a>
            <a href="?{{ request.GET.urlencode }}" class="btn btn-primary ms-2">다시 하기</a>
        </div>
    </div>

</div>

{{ menus_json|json_script:"worldcup-menus" }}

<style>
    .wc-card {
        cursor: pointer; border: 2px solid var(--line); border-radius: var(--radius);
        overflow: hidden; background: #fff; transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease;
        max-width: 260px;
    }
    .wc-card:hover { transform: translateY(-4px); border-color: var(--brand); box-shadow: var(--shadow-md); }
    .wc-card-img { height: 160px; display: flex; align-items: center; justify-content: center; background: var(--brand-soft); font-size: 3rem; }
    .wc-card-img img { width: 100%; height: 100%; object-fit: cover; }
    .wc-card-name { padding: .8rem; text-align: center; font-weight: 700; color: var(--ink); }
    .wc-vs { display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.4rem; color: var(--muted); }
</style>
{% endblock %}

{% block extra_js %}
<script>
(function () {
    var all = JSON.parse(document.getElementById('worldcup-menus').textContent || '[]');
    if (all.length < 2) return;

    function shuffle(arr) {
        var a = arr.slice();
        for (var i = a.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
        }
        return a;
    }

    var current = shuffle(all);
    var next = [];
    var matchIdx = 0;

    var matchEl = document.getElementById('wcMatch');
    var progressEl = document.getElementById('wcProgress');
    var finalEl = document.getElementById('wcFinal');

    function roundLabel(count) {
        return count === 2 ? '결승' : (count + '강');
    }

    function cardHtml(menu, side) {
        var img = menu.image
            ? '<img src="' + menu.image + '" alt="' + menu.name + '">'
            : '🍚';
        return '<div class="col-5"><div class="wc-card" data-side="' + side + '">'
            + '<div class="wc-card-img">' + img + '</div>'
            + '<div class="wc-card-name">' + menu.name + '</div>'
            + '</div></div>';
    }

    function renderMatch() {
        var totalMatches = current.length / 2;
        progressEl.textContent = roundLabel(current.length) + ' · ' + (matchIdx + 1) + '/' + totalMatches;
        var a = current[matchIdx * 2], b = current[matchIdx * 2 + 1];
        matchEl.innerHTML = cardHtml(a, 'a') + '<div class="col-1 wc-vs">VS</div>' + cardHtml(b, 'b');
        matchEl.querySelectorAll('.wc-card').forEach(function (el) {
            el.addEventListener('click', function () {
                var winner = el.dataset.side === 'a' ? a : b;
                next.push(winner);
                matchIdx++;
                if (matchIdx >= totalMatches) {
                    current = next;
                    next = [];
                    matchIdx = 0;
                }
                if (current.length === 1) {
                    showFinal(current[0]);
                } else {
                    renderMatch();
                }
            });
        });
    }

    function showFinal(winner) {
        matchEl.hidden = true;
        progressEl.hidden = true;
        finalEl.hidden = false;
        document.getElementById('wcFinalName').textContent = winner.name;
        document.getElementById('wcFinalLink').href = '/menus/' + winner.id + '/';
    }

    renderMatch();
})();
</script>
{% endblock %}
